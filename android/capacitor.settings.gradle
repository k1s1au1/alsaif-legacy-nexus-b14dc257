// DO NOT EDIT THIS FILE! IT IS GENERATED EACH TIME "capacitor update" IS RUN
// Modified to safely handle missing plugin directories.

def includePlugin(String name, String path) {
    def pluginDir = new File(rootDir, path)
    if (pluginDir.exists()) {
        include name
        project(name).projectDir = pluginDir
    } else {
        println "Warning: Capacitor plugin ${name} not found at ${path}. Did you run 'npm install'?"
    }
}

includePlugin(':capacitor-android', '../node_modules/@capacitor/android/capacitor')
includePlugin(':capacitor-app', '../node_modules/@capacitor/app/android')
includePlugin(':capacitor-haptics', '../node_modules/@capacitor/haptics/android')
includePlugin(':capacitor-push-notifications', '../node_modules/@capacitor/push-notifications/android')
